<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sabor Nutricionista</title>
    <link rel="stylesheet" href="./css/resultadoStlyles.css" />
    <link rel="stylesheet" href="./css/global.css" />
    <link rel="stylesheet" href="./css/resultadoStlyles.css" />
  </head>
  <body>
    <header class="cabecalho">
      <!--================= Logo ============ -->
      <svg
        xmlns="http://www.w3.org/2000/svg"
        viewBox="0 0 100 100"
        class="logo"
        width="45"
        height="45"
      >
        <!-- Fundo verde com cantos arredondados usando a sua cor principal -->
        <rect width="100" height="100" rx="35" fill="var(--color-primary)" />

        <!-- Linha do batimento cardíaco branca -->
        <polyline
          points="25,52 38,52 46,28 58,75 65,52 75,52"
          fill="none"
          stroke="#ffffff"
          stroke-width="6"
          stroke-linecap="round"
          stroke-linejoin="round"
        />
      </svg>
      <div class="textoHeader">
        <h1>NutriFit</h1>
        <h2>Seu asssistente de saúde e nutrição</h2>
      </div>
    </header>
    <main>
      <nav class="navegacaoPaginas">
        <div class="ativo">
          <a href="./index.html" class="Consulta">
            <svg
              xmlns="http://www.w3.org/2000/svg"
              height="22px"
              viewBox="0 -960 960 960"
              width="22px"
              fill="#e3e3e3"
            >
              <path
                d="M320-240h60v-80h80v-60h-80v-80h-60v80h-80v60h80v80Zm200-30h200v-60H520v60Zm0-100h200v-60H520v60Zm44-152 56-56 56 56 42-42-56-58 56-56-42-42-56 56-56-56-42 42 56 56-56 58 42 42Zm-314-70h200v-60H250v60Zm-50 472q-33 0-56.5-23.5T120-200v-560q0-33 23.5-56.5T200-840h560q33 0 56.5 23.5T840-760v560q0 33-23.5 56.5T760-120H200Zm0-80h560v-560H200v560Zm0-560v560-560Z"
              />
            </svg>
            <span class="texto">Nova<br />Consulta</span>
          </a>
        </div>

        <div>
          <a href="./historico.html" class="Historico">
            <svg
              xmlns="http://www.w3.org/2000/svg"
              height="22px"
              viewBox="0 -960 960 960"
              width="22px"
              fill="#e3e3e3"
            >
              <path
                d="M480-120q-138 0-240.5-91.5T122-440h82q14 104 92.5 172T480-200q117 0 198.5-81.5T760-480q0-117-81.5-198.5T480-760q-69 0-129 32t-101 88h110v80H120v-240h80v94q51-64 124.5-99T480-840q75 0 140.5 28.5t114 77q48.5 48.5 77 114T840-480q0 75-28.5 140.5t-77 114q-48.5 48.5-114 77T480-120Zm112-192L440-464v-216h80v184l128 128-56 56Z"
              />
            </svg>
            <span class="texto">Histórico</span>
          </a>
        </div>
      </nav>
      <section>
        <div class="Card">
          <div class="resultadoConsulta">
            <h2>Resultado da Consulta</h2>
            <h3>Confira os calculos realizados</h3>
          </div>

          <div class="dadosCliente">
            <div>
              <label>Nome</label>
              <label id="nomeResultado"> {nome} </label>
            </div>
            <div>
              <label>Peso</label>
              <label id="pesoResultado"> {peso} </label>
            </div>

            <div>
              <label>Altura</label>
              <label id="alturaResultado"> {altura} </label>
            </div>

            <div>
              <label>Idade</label>
              <label id="idadeResultado"> {idade} </label>
            </div>
          </div>

          <div class="resultadosCalculos">
            <div class="IMC">
              <label>IMC</label>
              <label id="imcResultado"> {imc} </label>
            </div>
            <div class="aguaDiaria">
              <label>Água Diária</label>
              <label id="aguaResultado"> {agua} </label>
            </div>
            <div class="GastoCalorico">
              <label>Gasto Calórico Diário</label>
              <label id="gastoCaloricoResultado"> {gastoCalorico} </label>
              <label id="objetivoResultado"> {objetivo} </label>
            </div>
          </div>

          <div class="enviar">
            <a href="index.html" class="NovaConsulta">Nova Consulta</a>
            <a href="#" class="Salvar">Salvar no Historico</a>
            <!-- <button href="#" class="Salvar">Salvar no Historico</button>
                      <button class="NovaConsulta" href="index.html">Nova Consulta</button> -->
          </div>
        </div>
      </section>
    </main>
    <footer>
      <p>NutriFit © 2026 - Controle seus dados corporais e nutricionais.</p>
    </footer>
  </body>
</html>
